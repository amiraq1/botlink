name: CI

on:
  push:
    branches: [main, ci/verify]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # All actions are pinned to exact 40-char commit SHAs (HEAD as resolved
      # via `git ls-remote https://github.com/<owner>/<repo> HEAD` on 2026-11-21).
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.4"
          cache-dependency-path: go.sum

      - name: Go checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9
        with:
          version: 10.26.1

      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Frontend checks
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
