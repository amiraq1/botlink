app = "botlink-u7vyhg"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# SQLite lives on a machine-local volume: never run more than one machine
# until storage is migrated to a shared database.
[deploy]
  strategy = "immediate"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "botlink_data"
  destination = "/data"
